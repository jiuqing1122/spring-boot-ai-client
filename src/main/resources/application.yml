server:
  port: 8080

spring:
  application:
    name: spring-boot-ai-client
  # 本地默认走 dev 配置（数据库口令在 application-dev.yml，不进 git）
  profiles:
    active: dev
  datasource:
    driver-class-name: ${myaihub.datasource.driver-class-name}
    url: ${myaihub.datasource.url}
    username: ${myaihub.datasource.username}
    password: ${myaihub.datasource.password}
  web:
    resources:
      add-mappings: true  # 开发期需要访问 /rag_test.html 等静态调试页
  mvc:
    async:
      request-timeout: -1  # -1 表示请求不超时
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 与 FastAPI 的 MAX_UPLOAD_MB=20 对齐
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产走环境变量；本地 dev 在 application-dev.yml 覆盖
    secret: ${JWT_SECRET:}
    expire-minutes: 120

# FastAPI 服务地址配置
fastapi:
  # 容器部署时由 FASTAPI_BASE_URL=http://fastapi:8000 覆盖
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  # 连接超时（毫秒）
  connect-timeout: 5000
  # 读超时（毫秒），AI 调用可能较慢，设为 60 秒
  read-timeout: 60000

logging:
  level:
    com.example.aiclient: DEBUG
  charset:
    console: UTF-8